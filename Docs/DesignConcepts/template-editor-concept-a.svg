<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#111817}.panel{fill:#20262b}.panel2{fill:#252c33}.bar{fill:#1b2026}.muted{fill:#343b44}.blue{fill:#3d78ba}.green{fill:#2d504f}.gold{fill:#8a612f}.text{fill:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.small{font-size:18px}.mid{font-size:22px;font-weight:700}.big{font-size:28px;font-weight:800}.hint{fill:#bac4cc;font-size:16px}.line{stroke:#48515b;stroke-width:2}.dash{stroke:#6b7681;stroke-width:2;stroke-dasharray:8 8}.accent{stroke:#66a9ff;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="bar" x="0" y="0" width="1440" height="72"/>
  <text class="text big" x="28" y="45">方案 A：操作栏和属性区分离</text>
  <text class="text small" x="460" y="43">模板 1001　新手　7 x 6　未保存</text>
  <rect class="muted" x="800" y="18" width="120" height="38"/><text class="text small" x="832" y="43">撤销</text>
  <rect class="muted" x="932" y="18" width="120" height="38"/><text class="text small" x="964" y="43">重做</text>
  <rect class="blue" x="1064" y="18" width="140" height="38"/><text class="text small" x="1096" y="43">保存模板</text>
  <rect class="muted" x="1216" y="18" width="160" height="38"/><text class="text small" x="1246" y="43">返回地图</text>

  <rect class="panel" x="28" y="96" width="250" height="760"/>
  <text class="text mid" x="52" y="135">模板库</text>
  <text class="hint" x="52" y="168">选择、复制、删除模板</text>
  <rect class="blue" x="52" y="210" width="202" height="46"/><text class="text small" x="84" y="240">1001 新手</text>
  <rect class="muted" x="52" y="266" width="202" height="46"/><text class="text small" x="82" y="296">2001 常规 D1</text>
  <rect class="muted" x="52" y="322" width="202" height="46"/><text class="text small" x="82" y="352">3001 奖励</text>
  <rect class="muted" x="52" y="700" width="202" height="42"/><text class="text small" x="88" y="727">打开模板库</text>

  <rect class="panel" x="304" y="96" width="1108" height="760"/>
  <text class="text mid" x="328" y="134">模板编辑</text>
  <text class="hint" x="328" y="164">第一行只放模板属性；动作按钮只在顶部出现</text>

  <rect class="panel2" x="328" y="190" width="520" height="116"/>
  <text class="text small" x="352" y="224">模板属性</text>
  <rect class="muted" x="352" y="242" width="90" height="38"/><text class="text small" x="377" y="267">ID</text>
  <rect class="blue" x="454" y="242" width="90" height="38"/><text class="text small" x="480" y="267">新手</text>
  <rect class="muted" x="556" y="242" width="90" height="38"/><text class="text small" x="582" y="267">常规</text>
  <rect class="muted" x="658" y="242" width="90" height="38"/><text class="text small" x="684" y="267">奖励</text>
  <text class="hint" x="352" y="294">非常规模板不显示难度，避免误解</text>

  <rect class="panel2" x="872" y="190" width="500" height="116"/>
  <text class="text small" x="896" y="224">尺寸</text>
  <rect class="muted" x="896" y="242" width="110" height="38"/><text class="text small" x="922" y="267">减少行</text>
  <rect class="blue" x="1018" y="242" width="110" height="38"/><text class="text small" x="1042" y="267">高度 6</text>
  <rect class="muted" x="1140" y="242" width="110" height="38"/><text class="text small" x="1166" y="267">增加行</text>
  <text class="hint" x="896" y="294">尺寸控制独立，不和保存/应用混在一起</text>

  <rect class="panel2" x="328" y="330" width="1044" height="100"/>
  <text class="text small" x="352" y="362">画笔栏</text>
  <rect class="green" x="352" y="380" width="110" height="34"/><text class="text small" x="384" y="403">地形</text>
  <rect class="muted" x="470" y="380" width="110" height="34"/><text class="text small" x="502" y="403">奖励</text>
  <rect class="muted" x="588" y="380" width="110" height="34"/><text class="text small" x="620" y="403">道具</text>
  <rect class="muted" x="706" y="380" width="110" height="34"/><text class="text small" x="738" y="403">装饰</text>
  <rect class="gold" x="860" y="372" width="54" height="54"/><text class="text small" x="879" y="405">土</text>
  <rect class="muted" x="924" y="372" width="54" height="54"/><text class="text small" x="943" y="405">石</text>
  <rect class="muted" x="988" y="372" width="54" height="54"/><text class="text small" x="1007" y="405">基</text>

  <rect class="bg" x="458" y="470" width="760" height="330"/>
  <rect fill="#294850" x="514" y="492" width="672" height="288"/>
  <g>
    <rect fill="#b87838" x="562" y="540" width="576" height="192"/>
    <rect fill="#71808e" x="562" y="636" width="96" height="96"/>
    <rect fill="#142832" x="850" y="636" width="96" height="96"/>
  </g>
  <text class="text small" x="478" y="535">000</text><text class="text small" x="478" y="631">001</text><text class="text small" x="478" y="727">002</text>
  <rect class="accent" x="514" y="492" width="672" height="288"/>
  <text class="hint" x="514" y="822">推荐点：最容易理解。动作、属性、画笔、画布各在固定区域。</text>
</svg>
