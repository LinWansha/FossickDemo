<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#111817}.panel{fill:#20262b}.panel2{fill:#252c33}.bar{fill:#1b2026}.muted{fill:#343b44}.blue{fill:#3d78ba}.green{fill:#2d504f}.gold{fill:#8a612f}.warn{fill:#8a4934}.text{fill:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.small{font-size:18px}.mid{font-size:22px;font-weight:700}.big{font-size:28px;font-weight:800}.hint{fill:#bac4cc;font-size:16px}.accent{stroke:#66a9ff;stroke-width:3;fill:none}.line{stroke:#48515b;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="bar" x="0" y="0" width="1440" height="72"/>
  <text class="text big" x="28" y="45">方案 D：画布优先 + 右侧 Inspector + 顶部保存区</text>
  <text class="hint" x="690" y="43">B 的布局效率 + C 的明确状态</text>
  <rect class="muted" x="980" y="18" width="110" height="38"/><text class="text small" x="1018" y="43">撤销</text>
  <rect class="muted" x="1102" y="18" width="110" height="38"/><text class="text small" x="1140" y="43">重做</text>
  <rect class="blue" x="1224" y="18" width="150" height="38"/><text class="text small" x="1256" y="43">保存模板</text>

  <rect class="panel" x="28" y="96" width="238" height="760"/>
  <text class="text mid" x="52" y="135">模板库</text>
  <text class="hint" x="52" y="166">选择模板后进入编辑</text>
  <rect class="blue" x="52" y="204" width="190" height="46"/><text class="text small" x="82" y="234">1001 新手</text>
  <rect class="muted" x="52" y="260" width="190" height="46"/><text class="text small" x="80" y="290">2001 常规</text>
  <rect class="muted" x="52" y="316" width="190" height="46"/><text class="text small" x="80" y="346">3001 奖励</text>
  <rect class="panel2" x="52" y="420" width="190" height="118"/>
  <text class="text small" x="72" y="452">当前状态</text>
  <text class="hint" x="72" y="484">模板编辑</text>
  <text class="hint" x="72" y="512">有未保存修改</text>
  <rect class="muted" x="52" y="700" width="190" height="42"/><text class="text small" x="82" y="727">返回地图编辑</text>

  <rect class="panel" x="290" y="96" width="820" height="760"/>
  <text class="text mid" x="314" y="135">矿井画布</text>
  <text class="hint" x="314" y="166">画笔和地图放在同一视觉区域；模板属性不占用画布上方</text>
  <rect class="panel2" x="314" y="196" width="772" height="90"/>
  <text class="text small" x="338" y="228">画笔</text>
  <rect class="blue" x="424" y="212" width="100" height="36"/><text class="text small" x="456" y="236">地形</text>
  <rect class="muted" x="536" y="212" width="100" height="36"/><text class="text small" x="568" y="236">奖励</text>
  <rect class="muted" x="648" y="212" width="100" height="36"/><text class="text small" x="680" y="236">道具</text>
  <rect class="gold" x="792" y="205" width="58" height="58"/><text class="text small" x="812" y="239">土</text>
  <rect class="muted" x="862" y="205" width="58" height="58"/><text class="text small" x="882" y="239">石</text>
  <rect class="muted" x="932" y="205" width="58" height="58"/><text class="text small" x="952" y="239">基</text>

  <rect class="bg" x="344" y="322" width="736" height="480"/>
  <rect fill="#294850" x="392" y="352" width="640" height="420"/>
  <rect fill="#b87838" x="440" y="432" width="544" height="280"/>
  <rect fill="#71808e" x="440" y="572" width="82" height="82"/>
  <rect fill="#142832" x="686" y="654" width="82" height="82"/>
  <text class="text small" x="360" y="426">000</text><text class="text small" x="360" y="508">001</text><text class="text small" x="360" y="590">002</text><text class="text small" x="360" y="672">003</text>
  <rect class="accent" x="392" y="352" width="640" height="420"/>

  <rect class="panel" x="1134" y="96" width="278" height="760"/>
  <text class="text mid" x="1158" y="135">模板 Inspector</text>
  <text class="hint" x="1158" y="166">只放属性和危险操作</text>
  <rect class="panel2" x="1158" y="204" width="230" height="176"/>
  <text class="text small" x="1180" y="236">模板信息</text>
  <rect class="muted" x="1180" y="258" width="86" height="36"/><text class="text small" x="1209" y="282">ID</text>
  <rect class="blue" x="1278" y="258" width="86" height="36"/><text class="text small" x="1304" y="282">新手</text>
  <rect class="muted" x="1180" y="304" width="86" height="36"/><text class="text small" x="1206" y="328">常规</text>
  <rect class="muted" x="1278" y="304" width="86" height="36"/><text class="text small" x="1304" y="328">奖励</text>
  <text class="hint" x="1180" y="362">新手模板不参与难度池</text>

  <rect class="panel2" x="1158" y="404" width="230" height="128"/>
  <text class="text small" x="1180" y="436">尺寸</text>
  <rect class="muted" x="1180" y="458" width="54" height="34"/><text class="text small" x="1199" y="481">-</text>
  <rect class="blue" x="1244" y="458" width="72" height="34"/><text class="text small" x="1254" y="481">高 6</text>
  <rect class="muted" x="1326" y="458" width="38" height="34"/><text class="text small" x="1338" y="481">+</text>

  <rect class="panel2" x="1158" y="556" width="230" height="188"/>
  <text class="text small" x="1180" y="588">模板动作</text>
  <rect class="blue" x="1180" y="612" width="184" height="36"/><text class="text small" x="1230" y="636">保存</text>
  <rect class="warn" x="1180" y="658" width="184" height="36"/><text class="text small" x="1212" y="682">放弃修改</text>
  <rect class="muted" x="1180" y="704" width="184" height="36"/><text class="text small" x="1212" y="728">应用到地图</text>
  <text class="hint" x="1158" y="806">特点：老手效率高，信息边界清楚。</text>
</svg>
