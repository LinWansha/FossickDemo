  <rect class="muted" x="1030" y="18" width="110" height="38"/><text class="text small" x="1068" y="43">撤销</text>
  <rect class="muted" x="1152" y="18" width="110" height="38"/><text class="text small" x="1190" y="43">重做</text>
  <rect class="blue" x="1274" y="18" width="120" height="38"/><text class="text small" x="1306" y="43">保存</text>

  <rect class="panel" x="28" y="96" width="238" height="760"/>
