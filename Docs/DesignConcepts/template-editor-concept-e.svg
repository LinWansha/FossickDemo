  <text class="hint" x="1158" y="166">上下文随步骤变化</text>
  <rect class="panel2" x="1158" y="204" width="230" height="196"/>
  <text class="text small" x="1180" y="236">绘制设置</text>
  <text class="hint" x="1180" y="270">编辑层：地形</text>
  <text class="hint" x="1180" y="300">画笔：土</text>
  <text class="hint" x="1180" y="330">拖动可连续绘制</text>
  <rect class="muted" x="1180" y="350" width="184" height="34"/><text class="text small" x="1210" y="373">批量行操作</text>

  <rect class="panel2" x="1158" y="430" width="230" height="154"/>
  <text class="text small" x="1180" y="462">模板信息摘要</text>
  <text class="hint" x="1180" y="496">ID：1001</text>
  <text class="hint" x="1180" y="526">类型：新手</text>
  <text class="hint" x="1180" y="556">高度：6</text>

  <rect class="panel2" x="1158" y="620" width="230" height="124"/>
  <text class="text small" x="1180" y="652">下一步</text>
  <rect class="blue" x="1180" y="676" width="184" height="36"/><text class="text small" x="1214" y="700">应用到地图</text>
  <text class="hint" x="1158" y="806">特点：C 的流程感更轻，不打断老手绘制。</text>
