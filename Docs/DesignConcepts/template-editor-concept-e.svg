  <rect class="muted" x="52" y="236" width="190" height="42"/><text class="text small" x="84" y="263">模板库</text>
  <rect class="muted" x="52" y="288" width="190" height="42"/><text class="text small" x="84" y="315">生成规则</text>
  <rect class="muted" x="52" y="340" width="190" height="42"/><text class="text small" x="84" y="367">地图实例</text>
  <rect class="panel2" x="52" y="470" width="190" height="160"/>
  <text class="text small" x="72" y="502">当前模板</text>
  <text class="hint" x="72" y="536">1001 新手</text>
  <text class="hint" x="72" y="566">高度 6</text>
  <text class="hint" x="72" y="596">未保存修改</text>

  <rect class="panel" x="290" y="96" width="820" height="760"/>
  <rect class="panel2" x="314" y="120" width="772" height="74"/>
  <rect class="stepOn" x="338" y="140" width="146" height="34"/><text class="text small" x="370" y="163">1 信息</text>
  <rect class="stepOn" x="500" y="140" width="146" height="34"/><text class="text small" x="532" y="163">2 绘制</text>
  <rect class="step" x="662" y="140" width="146" height="34"/><text class="text small" x="694" y="163">3 应用</text>
  <text class="hint" x="834" y="163">当前：绘制内容</text>

