  <rect class="blue" x="338" y="284" width="100" height="36"/><text class="text small" x="370" y="308">地形</text>
  <rect class="muted" x="450" y="284" width="100" height="36"/><text class="text small" x="482" y="308">奖励</text>
  <rect class="muted" x="562" y="284" width="100" height="36"/><text class="text small" x="594" y="308">道具</text>
  <rect class="gold" x="720" y="272" width="58" height="58"/><text class="text small" x="740" y="306">土</text>
  <rect class="muted" x="790" y="272" width="58" height="58"/><text class="text small" x="810" y="306">石</text>
  <rect class="muted" x="860" y="272" width="58" height="58"/><text class="text small" x="880" y="306">基</text>

  <rect class="bg" x="344" y="382" width="736" height="430"/>
  <rect fill="#294850" x="392" y="412" width="640" height="370"/>
  <rect fill="#b87838" x="440" y="488" width="544" height="246"/>
  <rect fill="#71808e" x="440" y="610" width="82" height="82"/>
  <rect fill="#142832" x="686" y="652" width="82" height="82"/>
  <text class="text small" x="360" y="482">000</text><text class="text small" x="360" y="564">001</text><text class="text small" x="360" y="646">002</text><text class="text small" x="360" y="728">003</text>
  <rect class="accent" x="392" y="412" width="640" height="370"/>

  <rect class="panel" x="1134" y="96" width="278" height="760"/>
