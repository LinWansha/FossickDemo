<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg{fill:#111817}.panel{fill:#20262b}.panel2{fill:#252c33}.bar{fill:#1b2026}.muted{fill:#363d46}.blue{fill:#3d78ba}.green{fill:#2d504f}.gold{fill:#8a612f}.text{fill:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.big{font-size:30px;font-weight:800}.mid{font-size:22px;font-weight:800}.small{font-size:18px}.tiny{font-size:15px}.hint{fill:#bac4cc;font-size:16px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.subtle{fill:#87929c;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.accent{stroke:#66a9ff;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980"/>
  <rect class="bar" x="0" y="0" width="1600" height="72"/>
