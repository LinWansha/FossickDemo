  <rect class="panel2" x="1238" y="666" width="310" height="90"/>
  <text class="text small" x="1260" y="700">校验：通过</text>
  <text class="hint" x="1260" y="730">没有发现问题</text>

  <rect class="panel2" x="1238" y="780" width="310" height="120"/>
  <text class="text small" x="1260" y="812">本次拼接顺序</text>
  <text class="subtle" x="1260" y="840">#00 1001 新手　#01 2001 D1</text>
  <text class="subtle" x="1260" y="866">#02 2003 D3　#03 3001 奖励</text>
</svg>
