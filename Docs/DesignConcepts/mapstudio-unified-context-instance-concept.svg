  <rect class="muted" x="456" y="286" width="118" height="38"/><text class="text small" x="500" y="311">地形</text>
  <rect class="muted" x="582" y="286" width="118" height="38"/><text class="text small" x="626" y="311">奖励</text>
  <rect class="muted" x="708" y="286" width="118" height="38"/><text class="text small" x="752" y="311">道具</text>
  <rect class="muted" x="834" y="286" width="118" height="38"/><text class="text small" x="878" y="311">装饰</text>
  <rect class="blue" x="960" y="286" width="118" height="38"/><text class="text small" x="1004" y="311">阴影</text>
  <rect class="muted" x="330" y="346" width="112" height="36"/><text class="text tiny" x="356" y="370">批量行操作</text>
  <rect class="muted" x="452" y="346" width="92" height="36"/><text class="text tiny" x="478" y="370">减少行</text>
  <rect class="muted" x="554" y="346" width="92" height="36"/><text class="text tiny" x="580" y="370">向下预览</text>

