  <text class="text small" x="52" y="530">生成配置</text>
  <rect class="muted" x="52" y="570" width="202" height="38"/><text class="text small" x="108" y="595">生成规则</text>
  <text class="text small" x="52" y="690">地图实例</text>
  <rect class="muted" x="52" y="720" width="202" height="38"/><text class="text small" x="92" y="745">生成地图实例</text>
  <rect class="muted" x="52" y="768" width="202" height="38"/><text class="text small" x="108" y="793">随机种子</text>

  <rect class="panel" x="306" y="96" width="880" height="840"/>
  <text class="text mid" x="330" y="136">地图实例编辑</text>
  <text class="hint" x="330" y="168">中间顶部只保留画笔与直接编辑动作</text>
