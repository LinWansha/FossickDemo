  <rect fill="#294850" x="462" y="472" width="610" height="370"/>
  <rect fill="#b87838" x="508" y="528" width="520" height="286"/>
  <rect fill="#71808e" x="508" y="672" width="76" height="76"/>
  <rect fill="#142832" x="742" y="738" width="76" height="76"/>
  <text class="text tiny" x="424" y="520">000</text><text class="text tiny" x="424" y="596">001</text><text class="text tiny" x="424" y="672">002</text><text class="text tiny" x="424" y="748">003</text><text class="text tiny" x="424" y="824">004</text>
  <rect class="accent" x="462" y="472" width="610" height="370"/>

