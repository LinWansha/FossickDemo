<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#111817}.panel{fill:#20262b}.panel2{fill:#252c33}.bar{fill:#1b2026}.muted{fill:#343b44}.blue{fill:#3d78ba}.green{fill:#2d504f}.gold{fill:#8a612f}.text{fill:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.small{font-size:18px}.mid{font-size:22px;font-weight:700}.big{font-size:28px;font-weight:800}.hint{fill:#bac4cc;font-size:16px}.accent{stroke:#66a9ff;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="bar" x="0" y="0" width="1440" height="72"/>
  <text class="text big" x="28" y="45">方案 B：画布优先 + 右侧 Inspector</text>
  <text class="text small" x="560" y="43">模板编辑中　未保存</text>
  <rect class="muted" x="910" y="18" width="120" height="38"/><text class="text small" x="942" y="43">撤销</text>
  <rect class="muted" x="1042" y="18" width="120" height="38"/><text class="text small" x="1074" y="43">重做</text>
  <rect class="blue" x="1174" y="18" width="150" height="38"/><text class="text small" x="1208" y="43">保存</text>

  <rect class="panel" x="28" y="96" width="220" height="760"/>
  <text class="text mid" x="52" y="135">画笔</text>
  <text class="hint" x="52" y="168">只保留绘制相关</text>
  <rect class="blue" x="52" y="210" width="172" height="40"/><text class="text small" x="96" y="236">地形</text>
  <rect class="muted" x="52" y="260" width="172" height="40"/><text class="text small" x="96" y="286">奖励</text>
  <rect class="muted" x="52" y="310" width="172" height="40"/><text class="text small" x="96" y="336">道具</text>
  <rect class="muted" x="52" y="360" width="172" height="40"/><text class="text small" x="96" y="386">装饰</text>
  <rect class="gold" x="52" y="430" width="76" height="76"/><text class="text small" x="81" y="475">土</text>
  <rect class="muted" x="148" y="430" width="76" height="76"/><text class="text small" x="177" y="475">石</text>

  <rect class="panel" x="272" y="96" width="812" height="760"/>
  <text class="text mid" x="296" y="135">矿井画布</text>
  <text class="hint" x="296" y="168">编辑时视线集中在地图；属性放到右侧</text>
  <rect class="bg" x="326" y="210" width="704" height="560"/>
  <rect fill="#294850" x="374" y="246" width="608" height="492"/>
  <rect fill="#b87838" x="422" y="328" width="512" height="328"/>
  <rect fill="#71808e" x="422" y="492" width="82" height="82"/>
  <rect fill="#142832" x="668" y="574" width="82" height="82"/>
  <text class="text small" x="342" y="320">000</text><text class="text small" x="342" y="402">001</text><text class="text small" x="342" y="484">002</text><text class="text small" x="342" y="566">003</text>
  <rect class="accent" x="374" y="246" width="608" height="492"/>

  <rect class="panel" x="1108" y="96" width="304" height="760"/>
  <text class="text mid" x="1132" y="135">Inspector</text>
  <text class="hint" x="1132" y="168">模板属性和危险操作集中</text>
  <rect class="panel2" x="1132" y="206" width="256" height="160"/>
  <text class="text small" x="1154" y="238">模板属性</text>
  <rect class="muted" x="1154" y="260" width="94" height="36"/><text class="text small" x="1183" y="284">ID</text>
  <rect class="blue" x="1260" y="260" width="94" height="36"/><text class="text small" x="1288" y="284">新手</text>
  <rect class="muted" x="1154" y="306" width="94" height="36"/><text class="text small" x="1182" y="330">常规</text>
  <rect class="muted" x="1260" y="306" width="94" height="36"/><text class="text small" x="1288" y="330">奖励</text>
  <rect class="panel2" x="1132" y="390" width="256" height="132"/>
  <text class="text small" x="1154" y="422">尺寸</text>
  <rect class="muted" x="1154" y="444" width="70" height="34"/><text class="text small" x="1175" y="467">-</text>
  <rect class="blue" x="1234" y="444" width="70" height="34"/><text class="text small" x="1246" y="467">高 6</text>
  <rect class="muted" x="1314" y="444" width="40" height="34"/><text class="text small" x="1328" y="467">+</text>
  <rect class="panel2" x="1132" y="548" width="256" height="196"/>
  <text class="text small" x="1154" y="580">模板操作</text>
  <rect class="blue" x="1154" y="606" width="200" height="36"/><text class="text small" x="1212" y="630">保存</text>
  <rect class="muted" x="1154" y="652" width="200" height="36"/><text class="text small" x="1194" y="676">放弃修改</text>
  <rect class="muted" x="1154" y="698" width="200" height="36"/><text class="text small" x="1194" y="722">应用到地图</text>
  <text class="hint" x="1132" y="804">推荐点：画布最大，适合长期编辑；但右侧属性对移动端较挤。</text>
</svg>
